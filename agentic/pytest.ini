[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    security: Phase 5 / Task 5.1 security regression suite — run with `pytest -m security`.
    e2e: Phase 5 / Task 5.2 end-to-end user-story suite — run with `pytest -m e2e`.
    perf: Phase 5 / Task 5.3 in-process micro-benchmarks (advisory; run with `pytest -m perf`).
